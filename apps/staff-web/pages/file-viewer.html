<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр файла</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #0b0b10; color: #eee; font-family: system-ui, sans-serif; }
        .bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            display: flex; align-items: center; gap: 12px;
            padding: 10px 16px; background: rgba(0,0,0,0.72); backdrop-filter: blur(6px);
        }
        .bar .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bar a, .bar button {
            color: #fff; text-decoration: none; background: #4F46E5; border: none;
            padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
        }
        .bar button.ghost { background: #333; }
        .stage {
            position: absolute; inset: 0; top: 52px;
            display: flex; align-items: center; justify-content: center;
            padding: 16px; overflow: auto;
        }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        video { max-width: 100%; max-height: 100%; background: #000; }
        iframe { width: 100%; height: 100%; border: 0; background: #fff; }
        pre {
            width: min(1000px, 100%); max-height: 100%; overflow: auto;
            background: #16161f; padding: 20px; border-radius: 12px;
            white-space: pre-wrap; word-break: break-word; font-size: 0.9rem; line-height: 1.5;
        }
        .err { color: #f87171; padding: 40px; text-align: center; }
    </style>
</head>
<body>
    <div class="bar">
        <div class="name" id="fileName">Файл</div>
        <a id="dlBtn" href="#" download>Скачать</a>
        <button class="ghost" onclick="window.close()">Закрыть</button>
    </div>
    <div class="stage" id="stage"><div class="err">Загрузка…</div></div>
    <script>
    (function() {
        const params = new URLSearchParams(location.search);
        let src = params.get('src') || '';
        const name = params.get('name') || 'Файл';
        const kind = params.get('kind') || 'file';
        const token = localStorage.getItem('crm_token') || '';
        document.getElementById('fileName').textContent = name;
        document.title = name;

        if (!src) {
            document.getElementById('stage').innerHTML = '<div class="err">Файл не указан</div>';
            return;
        }
        if (!src.startsWith('/uploads/') && !src.startsWith('http')) {
            document.getElementById('stage').innerHTML = '<div class="err">Некорректный путь</div>';
            return;
        }

        function withToken(url) {
            if (!url.startsWith('/uploads/') || !token) return url;
            const base = url.split('?')[0];
            return base + '?token=' + encodeURIComponent(token);
        }

        const url = withToken(src);
        const dl = document.getElementById('dlBtn');
        dl.href = url;
        dl.setAttribute('download', name);

        const stage = document.getElementById('stage');
        if (kind === 'image') {
            stage.innerHTML = '<img src="' + url.replace(/"/g, '') + '" alt="">';
        } else if (kind === 'video') {
            stage.innerHTML = '<video src="' + url.replace(/"/g, '') + '" controls autoplay></video>';
        } else if (kind === 'pdf') {
            stage.innerHTML = '<iframe src="' + url.replace(/"/g, '') + '" title="PDF"></iframe>';
        } else if (kind === 'text') {
            fetch(url).then(r => {
                if (!r.ok) throw new Error('Не удалось загрузить');
                return r.text();
            }).then(t => {
                const pre = document.createElement('pre');
                pre.textContent = t;
                stage.innerHTML = '';
                stage.appendChild(pre);
            }).catch(() => {
                stage.innerHTML = '<div class="err">Не удалось открыть текст. <a style="color:#818cf8" href="' + url + '">Скачать</a></div>';
            });
        } else {
            stage.innerHTML = '<div class="err">Предпросмотр недоступен. <a style="color:#818cf8" href="' + url + '" download>Скачать файл</a></div>';
        }
    })();
    </script>
</body>
</html>
