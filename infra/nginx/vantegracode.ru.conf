# Public site + client portal + API
# Place in /etc/nginx/sites-available/vantegracode.ru

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vantegracode.ru www.vantegracode.ru;
    return 301 https://vantegracode.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vantegracode.ru;
    return 301 https://vantegracode.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vantegracode.ru;

    root /var/www/vantegra-site;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ssl_certificate /etc/letsencrypt/live/vantegracode.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vantegracode.ru/privkey.pem;

    location = /healthz {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        access_log off;
    }

    location = /cabinet.php {
        return 302 /cabinet.html;
    }
    location = /login.php {
        return 302 /cabinet.html;
    }

    location ^~ /c/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Staff CRM
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.vantegracode.ru;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Lax";
    }
}

# Legacy CRM host — staff to app, client links to /c/
server {
    listen 443 ssl http2;
    server_name crm-seo-123.xyz;

    location = /pages/client.html {
        return 301 https://vantegracode.ru/c/$arg_t;
    }
    location /c/ {
        return 301 https://vantegracode.ru$request_uri;
    }
    location / {
        return 301 https://app.vantegracode.ru$request_uri;
    }
}