# HTTP bootstrap for the VPS until DNS + Let's Encrypt are on.
# Live path: /etc/nginx/sites-available/vantegracode.ru
# SSL version: infra/nginx/vantegracode.ru.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream crm_node {
    server 127.0.0.1:3005;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vantegracode.ru www.vantegracode.ru _;

    root /var/www/vantegra-site;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        proxy_pass http://crm_node;
        proxy_http_version 1.1;
        access_log off;
    }

    location = /cabinet.php { return 302 /cabinet.html; }
    location = /login.php { return 302 /cabinet.html; }
    location = /install.php { return 404; }

    location ^~ /inc/ { deny all; }

    location ^~ /c/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://crm_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/ {
        proxy_pass http://crm_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /pages/ {
        proxy_pass http://crm_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /assets/css/ {
        proxy_pass http://crm_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location ^~ /assets/js/ {
        proxy_pass http://crm_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location ^~ /assets/img/ {
        proxy_pass http://crm_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location ^~ /uploads/ {
        proxy_pass http://crm_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.vantegracode.ru;

    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://crm_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
