# Postgres on a 2GB VPS. Drop into conf.d or pass as -c flags.
# Do not enable wal_level=replica here: extra WAL RAM we cannot spare.

listen_addresses = '127.0.0.1'
max_connections = 20
shared_buffers = 32MB
work_mem = 1MB
maintenance_work_mem = 32MB
effective_cache_size = 256MB
wal_level = minimal
max_wal_senders = 0
max_wal_size = 64MB
min_wal_size = 32MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
seq_page_cost = 1.0
idle_in_transaction_session_timeout = 30000
log_min_duration_statement = 1000
autovacuum_max_workers = 1
